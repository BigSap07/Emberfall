<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    /* ---- reused verbatim from Main.dc.html - keep files in sync if this block changes ---- */
    .icon-btn { width:38px; height:38px; border-radius:8px; background:rgba(20,18,26,0.72); border:1px solid rgba(203,162,74,0.45); display:flex; align-items:center; justify-content:center; position:relative; flex:none; }
    .icon-btn svg { width:18px; height:18px; }
    .chip { display:flex; align-items:center; gap:9px; background:rgba(20,18,26,0.72); border:1px solid rgba(203,162,74,0.55); border-radius:8px; padding:8px 14px; }
    .chip span { font-family:'Cinzel',serif; font-weight:600; font-size:14px; }

    /* ---- aspect filter pill: one per aspect, --a is the accent. Active state is a filled ring +
       glow; inactive just dims. "All" reuses the same class with the gold hub accent. ---- */
    .aspect-filter { width:38px; height:38px; border-radius:50%; border:2px solid var(--a, #cba24a); background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.10), rgba(0,0,0,0.35)); display:flex; align-items:center; justify-content:center; flex:none; }
    .aspect-filter svg { width:18px; height:18px; }
    .aspect-filter.active { box-shadow:0 0 0 3px rgba(203,162,74,0.18), 0 0 10px var(--a, #cba24a); }
    .aspect-filter.inactive { opacity:0.45; }

    /* ---- hero card: rounded-square portrait tile for dense grids (vs. the circular badge
       language used elsewhere in the hub) - denser tiling reads better at roster scale. --a is
       the aspect accent. New card: copy the block, swap the image, --a and the two text lines. ---- */
    .hcard { width:150px; display:flex; flex-direction:column; align-items:center; gap:7px; }
    .hcard .tile { width:150px; height:150px; border-radius:12px; border:2px solid var(--a, #cba24a); background:#171420; overflow:hidden; position:relative; box-shadow:0 3px 10px rgba(0,0,0,0.5); }
    .hcard .tile img { width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block; }
    .hcard .aspect-chip { position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%; background:rgba(12,11,16,0.85); border:1px solid var(--a, #cba24a); display:flex; align-items:center; justify-content:center; }
    .hcard .aspect-chip svg { width:11px; height:11px; }
    .hcard .lvl-badge { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(0deg, rgba(8,7,10,0.92), rgba(8,7,10,0)); padding:14px 8px 6px; display:flex; justify-content:flex-end; }
    .hcard .lvl-badge span { font-family:'Cinzel',serif; font-size:11px; font-weight:700; color:#f3e2b8; background:rgba(16,14,20,0.85); border:1px solid var(--a, #cba24a); border-radius:5px; padding:1px 7px; }
    .hcard .name { font-family:'Cinzel',serif; font-size:12px; font-weight:600; color:#e8dfcd; text-align:center; }
    .hcard .tierpips { display:flex; gap:2px; }
    .hcard .tierpips i { width:5px; height:5px; border-radius:50%; background:rgba(203,162,74,0.25); display:block; }
    .hcard .tierpips i.lit { background:#e0b84a; box-shadow:0 0 4px #e0b84a; }
    .hcard.locked .tile { border-color:#3a3648; filter:grayscale(1) brightness(0.35); }
    .hcard.locked .name { color:#5c5768; }
  </style>
</helmet>

<div style="width:1600px; height:720px; position:relative; overflow:hidden; background:#0c0b10; font-family:'Manrope', sans-serif; color:#efe7d8; display:flex; flex-direction:column;">

  <img src="ash_marches_bg7.jpg" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; opacity:0.14; filter:blur(1px);">
  <div style="position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(40,34,54,0.35), rgba(10,9,14,0.92) 65%);"></div>

  <!-- ============ TOP BAR ============ -->
  <div style="position:relative; z-index:6; flex:0 0 74px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; border-bottom:1px solid rgba(203,162,74,0.22);">
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="icon-btn" style="width:40px; height:40px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#dcd2c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div>
        <div style="font-family:'Cinzel',serif; font-weight:700; font-size:19px; letter-spacing:0.02em; color:#f3e2b8;">Heroes</div>
        <!-- "Recollected" - DESIGN-WORLD's own term for a summoned hero, used instead of a generic
             owned-count label. Six exist today; this counter is written to keep meaning as more ship. -->
        <div style="font-size:10.5px; color:#a89e8e; margin-top:1px;">6 Recollected</div>
      </div>
    </div>

    <!-- aspect filter row: the six DESIGN-ASPECTS colours plus "All". Order matches DESIGN-WORLD's
         region order (Ember, Tide, Verdant, Gale, Umbra, Lumen) for the same reason a rulebook
         keeps one canonical ordering everywhere. -->
    <div style="display:flex; align-items:center; gap:9px;">
      <div class="aspect-filter active" style="--a:#cba24a;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3e2b8" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#E84532;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f3b08a" stroke-width="1.8"><path d="M12 2c1.5 3 1 4.5-.5 6C10 9.5 9 11 9 13a3 3 0 0 0 6 0c0-1 .5-1.8 1.2-2.4"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#28C7D9;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#a9e6ee" stroke-width="1.8"><path d="M12 3c3 4 6 7.2 6 10.5A6 6 0 0 1 6 13.5C6 10.2 9 7 12 3Z"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#62A77A;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#b8dcc4" stroke-width="1.8"><path d="M12 21c0-7 4-11 8-13-1 6-3 11-8 13Zm0 0c0-6-3-10-8-12 1 5 3 10 8 12Z"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#C6E34A;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e4f0ae" stroke-width="1.8"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#E7E0D0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e7e0d0" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </div>
      <div class="aspect-filter inactive" style="--a:#3568E8;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#a9c0f5" stroke-width="1.8"><path d="M12 2 20 9 12 22 4 9Z"/><path d="M4 9h16M12 2v20"/></svg>
      </div>
      <div style="width:1px; height:24px; background:rgba(203,162,74,0.3); margin:0 4px;"></div>
      <div class="chip" style="cursor:default;"><span style="font-size:12px;">Sort: Power &#9662;</span></div>
    </div>
  </div>

  <!-- ============ GRID ============ -->
  <div style="position:relative; z-index:5; flex:1 1 auto; padding:22px 30px; overflow:hidden;">
    <div style="background:rgba(16,14,20,0.5); border:1px solid rgba(203,162,74,0.25); border-radius:14px; padding:24px; height:100%; display:grid; grid-template-columns:repeat(8, 150px); grid-auto-rows:190px; gap:18px 20px; justify-content:center; align-content:start;">

      <!-- ---- 5 recollected heroes shown, roster caps at 6 (one aspect - Tide - has no summoned
           hero yet, the locked "???" slot below). Names/aspects here are per the user's live
           correction in chat, NOT DESIGN-ASPECTS.md, which still names this cast Kalyx Emberwright/
           Orrin Kaal/Maeve Corrin/Wren Ilyra/Ryn Solvarr/Nyx Serrow with different aspect
           assignments entirely - that doc is stale against whatever real naming pass produced Kael/
           Soren/Altheon/Brenna/Vespera and needs reconciling, this file is not the place to resolve
           it. Soren=Gale and Brenna=Verdant are unconfirmed (user said "i think" / said only
           "Rootbound" with no aspect) - flagged in chat, not yet a locked fact.
           Tier pips are a compact preview of the Ascension tab (6 pips = ascension ceiling, lit
           count = current tier) - full Ascension page is a separate follow-up mockup, not built yet. -->
      <div class="hcard">
        <div class="tile" style="--a:#E84532;">
          <img src="demon_bust.png">
          <div class="aspect-chip" style="--a:#E84532;"><svg viewBox="0 0 24 24" fill="none" stroke="#f3b08a" stroke-width="2"><path d="M12 2c1.5 3 1 4.5-.5 6C10 9.5 9 11 9 13a3 3 0 0 0 6 0c0-1 .5-1.8 1.2-2.4"/></svg></div>
          <div class="lvl-badge"><span>Lv 42</span></div>
        </div>
        <div class="name">Kael the Ashbound</div>
        <div class="tierpips"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i></i><i></i></div>
      </div>

      <div class="hcard">
        <div class="tile" style="--a:#C6E34A;">
          <img src="dragon_bust.png">
          <div class="aspect-chip" style="--a:#C6E34A;"><svg viewBox="0 0 24 24" fill="none" stroke="#e4f0ae" stroke-width="2"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9"/></svg></div>
          <div class="lvl-badge"><span>Lv 37</span></div>
        </div>
        <!-- name/aspect per user correction - unconfirmed by them ("i think"), flagged in chat -->
        <div class="name">Soren the First Kin</div>
        <div class="tierpips"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i></i><i></i><i></i></div>
      </div>

      <div class="hcard">
        <div class="tile" style="--a:#3568E8;">
          <img src="snowman_bust.png">
          <div class="aspect-chip" style="--a:#3568E8;"><svg viewBox="0 0 24 24" fill="none" stroke="#a9c0f5" stroke-width="2"><path d="M12 2 20 9 12 22 4 9Z"/><path d="M4 9h16M12 2v20"/></svg></div>
          <div class="lvl-badge"><span>Lv 40</span></div>
        </div>
        <div class="name">Altheon the First Witness</div>
        <div class="tierpips"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i></i><i></i></div>
      </div>

      <div class="hcard">
        <div class="tile" style="--a:#62A77A;">
          <img src="golem_bust.png">
          <div class="aspect-chip" style="--a:#62A77A;"><svg viewBox="0 0 24 24" fill="none" stroke="#b8dcc4" stroke-width="2"><path d="M12 21c0-7 4-11 8-13-1 6-3 11-8 13Zm0 0c0-6-3-10-8-12 1 5 3 10 8 12Z"/></svg></div>
          <div class="lvl-badge"><span>Lv 35</span></div>
        </div>
        <!-- Verdant is my inference from "Rootbound", not stated outright - flagged in chat -->
        <div class="name">Brenna the Rootbound</div>
        <div class="tierpips"><i class="lit"></i><i class="lit"></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="hcard">
        <div class="tile" style="--a:#E7E0D0;">
          <img src="angel_bust.png">
          <div class="aspect-chip" style="--a:#E7E0D0;"><svg viewBox="0 0 24 24" fill="none" stroke="#e7e0d0" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></div>
          <div class="lvl-badge"><span>Lv 33</span></div>
        </div>
        <div class="name">Vespera the Burden Bearer</div>
        <div class="tierpips"><i class="lit"></i><i class="lit"></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="hcard locked">
        <div class="tile" style="--a:#3a3648; display:flex; align-items:center; justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6a6478" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <div class="name">???</div>
        <div class="tierpips"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <!-- ---- future roster slots: unfilled, demonstrating the grid holds up long before there
           are 8x2 real heroes. DESIGN-WORLD: heroes can be added indefinitely with no story debt. -->
      <div class="hcard locked"><div class="tile" style="--a:#2a2732;"></div><div class="name" style="color:#3d3948;">&mdash;</div><div class="tierpips"></div></div>
      <div class="hcard locked"><div class="tile" style="--a:#2a2732;"></div><div class="name" style="color:#3d3948;">&mdash;</div><div class="tierpips"></div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
