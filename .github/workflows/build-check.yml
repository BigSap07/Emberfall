name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

# Every push and pull request runs on ubuntu-latest: Linux minutes are the cheap ones, and
# Tools/build-check.ps1 runs the same check there (the .NET SDK compiler at C# 5 in place of the
# Windows csc.exe, the same file lists, harness, walks, fingerprints and doc lint - see
# Tools/csharp.ps1 and CLAUDE.md). The Windows job is the reference platform the baselines were
# recorded on, and runs only when started by hand (Actions > Build Check > Run workflow).

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 shallow clone. The root-commit guard below walks
          # every ancestor of every ref; against a shallow checkout it reports 1 root regardless of
          # what the real history holds, so the guard would pass vacuously and prove nothing.
          # doc-lint's hash resolution needs the objects present for the same reason.
          fetch-depth: 0

      - name: Guard against a re-rooted history
        shell: pwsh
        run: |
          # This repository has exactly ONE root commit, and the number is PINNED, not a maximum.
          #
          # A root commit is one with no parents. A second appearing means a session ran git init or
          # committed a fresh tree instead of continuing the existing history, which silently
          # orphans everything before it: the old work is still in the object store but nothing
          # reaches it from a ref, and it goes when the repo is next garbage collected. That failure
          # is quiet and expensive, which is why it is worth a check that cannot be satisfied by
          # accident.
          #
          # If this fails, do NOT raise the number to make it green. Run
          # git rev-list --max-parents=0 --all, find the commit that introduced the new root, and
          # work out which session created it.
          $expected = 1
          $roots = (git rev-list --max-parents=0 --all | Measure-Object -Line).Lines
          Write-Host "root commits: $roots (expected $expected)"
          if ($roots -ne $expected) {
            Write-Error "Expected exactly $expected root commit(s), found $roots. History has been re-rooted."
            exit 1
          }

      # The SDK's Roslyn compiler (run at -langversion:5) and the runtime the harness runs on.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run build-check.ps1
        shell: pwsh
        run: |
          # The log is kept so a failure can be read without admin rights to the repository: failing lines
          # become annotations in the next step.
          ./Tools/build-check.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build-check.log"
          exit $LASTEXITCODE

      - name: Annotate failing lines
        if: failure()
        shell: pwsh
        run: |
          $n = 0
          foreach ($l in (Get-Content "$env:RUNNER_TEMP/build-check.log")) {
            if ($l -match 'FAIL|error CS|FAILED|Exception|not found|cannot') {
              $t = ([string]$l -replace '%', ' ').Trim()
              if ($t.Length -gt 400) { $t = $t.Substring(0, 400) }
              Write-Host "::error::$t"
              $n++
              if ($n -ge 40) { break }
            }
          }

  build-check-windows:
    # Kept for parity with the reference platform; started by hand only, never by a push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run build-check.ps1
        shell: pwsh
        run: ./Tools/build-check.ps1
